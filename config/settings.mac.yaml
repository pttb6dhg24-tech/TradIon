# TradIon — configuración central. TODA constante del sistema vive aquí; nada hardcodeado en los .py.
# Hardware de referencia: MacBook Pro M3, 16 GB RAM unificada, sin CUDA (DOCUMENTO_MAESTRO §7).

# ============================ LICENCIAS ============================
# TradIon es AGPL-3.0, pero los MODELOS que ejecuta son de terceros y varios de los
# que trae por defecto son NO COMERCIALES (NLLB-200 es CC-BY-NC-4.0; las voces
# ko_KR-kss, en_US-ryan y en_US-lessac son CC BY-NC-SA / research only). La cláusula
# NonCommercial restringe el USO, no solo la redistribución: no basta con que los
# pesos los descargue el usuario. Detalle completo en THIRD_PARTY_LICENSES.md.
licensing:
  commercial_use: false           # false = uso personal, investigación o demostración:
                                  # todo funciona igual y es legítimo.
                                  # true  = el arranque FALLA si hay algún componente no
                                  # comercial activo, diciéndote cuál y por qué
                                  # sustituirlo. Ponlo en true ANTES de cobrar por nada.

server:
  host: 0.0.0.0
  port: 8443
  ws_path: /ws                    # endpoint WebSocket: wss://<ip>:8443/ws
  heartbeat_s: 30                 # ping/pong automático de aiohttp
  # Certificados mkcert — obligatorios: getUserMedia exige HTTPS en los móviles (§1.4)
  tls_cert: config/certs/tradion.pem
  tls_key: config/certs/tradion-key.pem

paths:
  models_dir: models              # TODOS los pesos aquí; prohibido ~/.cache (auditoría M1)

languages:
  allowed: [es, ko, en]           # idiomas activos: el lobby solo ofrece estos
  nllb_codes:                     # códigos FLORES-200 que usa NLLB
    es: spa_Latn
    ko: kor_Hang
    en: eng_Latn

audio:
  sample_rate: 16000              # pipeline interno: PCM mono 16 kHz (el AudioWorklet re-muestrea)
  vad_window_samples: 512         # requisito DURO de silero-vad v5 a 16 kHz (auditoría C1)
  vad_threshold: 0.72
  pre_roll_ms: 192                # audio previo al arranque de voz que se conserva (6 ventanas)
  min_speech_ms: 300              # segmentos más cortos se descartan (clics, golpes)
  segment_close_silence_ms: 600   # silencio que cierra un segmento (rango útil: 300-800).
                                  # A 400 troceaba frases con pausas naturales a mitad
                                  # (Victus: 'And why you don't eat?' + 'cake in the
                                  # afternoon.' como DOS segmentos -> MT sin contexto)
  segment_max_seconds: 15         # tope duro por segmento

stt:
  device: cpu                     # faster-whisper/CTranslate2 no usa Metal: en Mac siempre cpu
  model_size: small              # M3/16GB: medium int8 (~1.2 GB). Mínima latencia: small. Máxima calidad: large-v3-turbo
  compute_type: int8
  beam_size: 1                    # greedy: prioridad latencia (auditoría A4)
  workers: 2                      # transcripciones concurrentes (hablantes simultáneos)
  cpu_threads: 4                  # hilos de CTranslate2 por transcripción
  lid_crosstalk_min_prob: 0.8     # confianza mínima del LID para descartar cross-captura
                                  # (otro idioma DE LA SALA en tu micro, p. ej. el vecino
                                  # muteado hablando al lado); por debajo NO descarta:
                                  # re-transcribe forzando tu idioma (acentos seguros)
  hallucination_blacklist:        # frases-alucinación de Whisper descartadas (sin mayúsculas/signos)
    - gracias por ver
    - gracias por mirar
    - thanks for watching
    - suscríbete
    - suscribete
    - sign up
    - 구독
    # Interjecciones sueltas: sin contenido traducible, NLLB inventa con ellas
    # ('Hmm' -> '¿Qué es eso?' medido en la Victus). OJO: nada de coreano aquí —
    # '어' es el 'sí' informal y '음' puede ser respuesta: descartarlos silenciaba
    # turnos reales de una palabra (hallazgo de la verificación adversarial)
    - hmm
    - hm
    - mmm
    - mm
    - uh
    - um
  speaker_gate:                   # F11: verificación de hablante contra la huella del enroll
    enabled: false                # requiere: pip install sherpa-onnx + scripts/setup_speaker_gate.py.
                                  # Caza la cross-captura del MISMO idioma (la guardia LID
                                  # solo ve idiomas distintos). Fail-open: sin modelo o sin
                                  # sherpa-onnx se desactiva solo con un aviso.
    enforce: false                # false = MODO SOMBRA: loguea la similitud de cada segmento
                                  # contra la huella del enroll pero JAMÁS descarta. Subir a
                                  # true SOLO tras revisar los logs de una sesión real y
                                  # ajustar accept/reject con esos números.
    model: models/speaker/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx
    accept: 0.55                  # >= : es el dueño del micro (medido: mismo hablante ~0.79)
    reject: 0.35                  # <  : voz ajena, segmento descartado (medido: ajenos 0.06-0.31)
    min_speech_s: 1.0             # con menos voz no se decide (el error se dispara <2 s)
    num_threads: 2                # hilos ONNX del extractor (~29 ms/segmento en CPU M3)
  partials:                       # transcripción parcial en vivo (ventana deslizante, F5.2)
    enabled: true
    model_size: tiny             # modelo DEDICADO a parciales (+~0.9 GB RAM): jamás compiten
                                  # con los finales/enroll del modelo principal por el executor
    cpu_threads: 2                # hilos del modelo de parciales
    interval_ms: 1200             # mínimo entre pasadas parciales por hablante
    min_speech_ms: 800            # voz acumulada antes de la primera pasada parcial
    window_s: 4                   # solo se transcribe la COLA del segmento abierto (acota CPU)

enroll:                           # calibración de voz validada por ASR (F5.2)
  similarity: 0.8                 # Levenshtein normalizado mínimo contra la frase pedida
  max_seconds: 15                 # expiración de seguridad del modo enroll en el servidor

translation:
  backend: ct2                    # ct2 = CTranslate2 int8 (recomendado). Alternativa sin conversión: transformers
  model: facebook/nllb-200-distilled-600M   # ⚠️ CC-BY-NC-4.0 (solo uso no comercial)
  ct2_dir: models/nllb-600m-ct2-int8        # salida de ct2-transformers-converter (~0.6 GB int8)
  # Con 16 GB cabe facebook/nllb-200-distilled-1.3B (mejor calidad, ~2x latencia):
  # cambiar model + ct2_dir y reconvertir.
  device: cpu
  beam_size: 2                    # compromiso calidad/latencia en CPU (4 = mejor calidad, más lento)
  max_input_tokens: 256
  max_output_tokens: 256
  workers: 2                      # traducciones concurrentes (solo efectivo con backend ct2)

tts:
  backend: piper                  # F9: librería biométrica + motor ultra-rápido.
                                  # MEDIDO en el M3: RTF 0.03-0.11 (sub-segundo real).
                                  # Alternativa 'f5tts': clonación Zero-Shot (modo calidad,
                                  # ~4-7 s por frase — no simultáneo).
  workers: 1                      # hilos del executor de TTS
  chunk_min_chars: 1              # con piper el coste fijo es ~50 ms: cada oración va sola
                                  # (TTFA mínimo). Con f5tts SUBIR a 60 (coste fijo ~3.1 s).
  piper:
    voices_dir: models/piper      # catálogo curado en backend/voice_catalog.py;
                                  # descarga: bash scripts/setup_voices.sh
  nfe_step: 8                     # (solo f5tts) pasos de flow matching
  # El motor elige device solo (MPS fp16 en el M3 > CUDA > CPU) y sintetiza con la HUELLA
  # VOCAL del hablante capturada en el enroll (client.ref_audio_path + ref_text): no hay
  # selección de voz. nfe_step=8 fijado en tts_engine.py (compromiso latencia/calidad).
  # Instalación (una vez): pip install f5-tts
  # Nota histórica: el backend MeloTTS (F3) queda retirado; su nota de instalación y el
  # pin transformers==4.27.4 siguen documentados en el DOCUMENTO_MAESTRO por si se revierte.

room:
  floor:                          # turno de palabra CSMA/CA (anti-crosstalk en mesa física)
    acquire_rms: 0.025            # voz franca necesaria para TOMAR el canal
    hold_rms: 0.012               # histéresis: MANTENERLO es más barato (finales suaves de frase)
    release_ms: 600               # silencio que libera el turno. INVARIANTE: mantener
                                  # >= audio.segment_close_silence_ms — si el floor se
                                  # libera con el segmento aún abierto, otro móvil puede
                                  # robar el canal en una pausa y el resto de TU frase
                                  # se pone a cero (media frase perdida)
    acquire_rel: 0.20             # v2: tomar el canal exige ADEMÁS este % del nivel de voz
                                  # calibrado de TU micro (tope 3x el absoluto): el 0.025
                                  # igual para todos dejaba que el micro más sensible (AGC)
                                  # robara el canal con la voz del vecino. 0.20 y no 0.30:
                                  # el enroll se habla con el micro CERCA y la mesa queda
                                  # lejos; la adaptación EMA lo corrige con el uso
    hold_rel: 0.10                # mantener: % relativo del nivel propio (tope 3x)
    contest_ms: 240               # ventana de contienda: gana quien suene más fuerte
                                  # RELATIVO a su calibración. >= periodo de frame del
                                  # cliente (128 ms) + jitter WiFi, o la puja del hablante
                                  # real llega tarde y se regresa al first-in-wins
    crosstalk_cooldown_s: 1.0     # cross-captura CORROBORADA => canal liberado y ese micro
                                  # 1 s en cuarentena
    crosstalk_confirmations: 2    # veredictos LID seguidos (<=10 s) antes de quitar el canal:
                                  # uno solo puede ser un cambio de idioma legítimo del dueño
    max_hold_s: 30                # tope duro anti-inanición (ruido de fondo permanente)
    reacquire_cooldown_s: 2       # cuarentena tras expulsión por max_hold_s (si no, re-toma el canal en el siguiente frame)
  max_speakers: 6
  require_headphones: true        # política acústica v1: evita el bucle de realimentación (§1.6)
  table_radius_m: 1.2             # radio del círculo de PannerNodes en el cliente
